# Initial project settings. Analysis-specific settings will be added with each pipeline step.
project: oncorna-ml
random_seed: 20261006
python_version: "3.11"

analysis:
  primary_endpoint: pam50_subtype
  secondary_endpoint: overall_survival_optional
  split_unit: patient_id
  primary_metric: macro_f1
  clinical_use: false

data:
  mode: demo
  demo_dir: data/demo
  raw_dir: data/raw
  processed_dir: data/processed
  # Expression values are log2-transformed normalized values, not raw counts.
  expression_source: "UCSC Xena TCGA hub: TCGA.BRCA.sampleMap/HiSeqV2"
  label_source: "UCSC Xena TCGA hub: BRCA_clinicalMatrix/PAM50Call_RNAseq"

qc:
  # Phase 1D starts from the frozen, one-sample-per-patient Phase 1C cohort.
  expected_cohort_samples: 844
  expression_scale: "log2(normalized_count + 1)"
  cohort_path: data/processed/classification_cohort.tsv
  expression_path: data/raw/TCGA-BRCA_HiSeqV2.tsv.gz
  sample_metrics_path: data/processed/qc_sample_metrics.tsv
  gene_summary_path: data/processed/qc_gene_summary.tsv
  report_path: docs/qc.md
  figure_dir: reports/figures/qc
  near_zero_expression_max: 0.1
  expression_prevalence_thresholds: [0.0, 1.0, 2.0]
  gene_filter:
    # Strict expression prevalence; labels are not used. Values are log2(normalized_count + 1).
    expression_gt: 1.0
    minimum_sample_fraction: 0.20
  sample_filter:
    # Exclude for unusable non-finite data or >5% missing values, never for Tukey flags alone.
    maximum_missing_fraction: 0.05
    exclude_any_infinite_values: true
    exclude_no_finite_values: true
  outlier_detection:
    # Exploratory sum of pre-filter log-expression values; not a read count/library size.
    metric: aggregate_expression_signal
    tukey_iqr_multiplier: 1.5

ml_matrix:
  # Phase 1E freezes the Phase 1C/1D sample and retained-gene dimensions.
  expected_sample_count: 844
  expected_source_gene_count: 20530
  expected_gene_count: 17623
  output_path: data/processed/ml_expression_matrix.tsv.gz
  gene_list_path: data/processed/ml_gene_list.tsv
  manifest_path: data/processed/ml_matrix_manifest.json
  expression_transform: "none; copy selected source values verbatim"

validation:
  # Freeze a patient-level test split before inspecting its metrics.
  test_fraction: 0.20
  outer_cv_folds: 5
  inner_cv_folds: 3

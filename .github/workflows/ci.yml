name: Synthetic checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.11.17'
            lock: linux
          - os: windows-2025
            python: '3.11.9'
            lock: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install hash-locked dependencies
        run: python -m pip --isolated install --require-hashes --no-deps -r requirements/dev-${{ matrix.lock }}-py311.lock
      - name: Install code without resolving dependencies
        run: python -m pip --isolated install --no-deps --no-build-isolation -e .
      - name: Verify installed dependency closure
        run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Formatting
        run: python -m ruff format --check src scripts tests tools
      - name: Full synthetic and mocked suite
        run: python -B -m pytest -q -p no:cacheprovider --basetemp=.pytest_cache/ci-tests
      - name: Synthetic scope, approved values and deterministic complete JSON
        run: python -B tools/check_demo.py
      - name: Build source archive and wheel with locked build tools
        run: python -m build --no-isolation
      - name: Audit both archives
        run: python -B tools/audit_distribution.py dist/oncorna_ml-0.1.0-py3-none-any.whl dist/oncorna_ml-0.1.0.tar.gz
      - name: Reinstall built wheel into fresh runtime-only environment
        shell: bash
        run: |
          python -m venv .pytest_cache/wheel-smoke
          if [ "${{ matrix.lock }}" = windows ]; then
            smoke=.pytest_cache/wheel-smoke/Scripts/python.exe
          else
            smoke=.pytest_cache/wheel-smoke/bin/python
          fi
          "$smoke" -m pip --isolated install --require-hashes --no-deps -r requirements/runtime-${{ matrix.lock }}-py311.lock
          "$smoke" -m pip --isolated install --no-deps dist/oncorna_ml-0.1.0-py3-none-any.whl
          "$smoke" -m pip check
          cd .pytest_cache
          ../"$smoke" -B ../tools/check_demo.py
      - name: Build minimal demo image
        if: runner.os == 'Linux'
        run: docker build --platform linux/amd64 -t oncorna-demo-ci .
      - name: Run container with no runtime network, mounts or capabilities
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,size=64m \
            oncorna-demo-ci > .pytest_cache/container-demo.json
          python -c "import json; r=json.load(open('.pytest_cache/container-demo.json')); assert r['scope']=='synthetic_demo_only'"

[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0", "packaging==26.3"]
build-backend = "setuptools.build_meta"

[project]
name = "oncorna-ml"
version = "0.1.0"
description = "Synthetic demo and input validation for the OncoRNA-ML research portfolio"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ekikeh" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = [
  "build==1.6.1",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "PyYAML>=6,<7",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["oncorna"]
namespaces = false

[tool.setuptools]
include-package-data = false
package-dir = {"" = "src", tools = "tools"}

[tool.setuptools.cmdclass]
build_py = "tools.package_build.SafeBuildPy"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
